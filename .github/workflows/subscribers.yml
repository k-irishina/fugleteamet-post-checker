name: Add subscribers

on:
  schedule:
    # Twice a day, 08:03 and 20:03 Oslo summer time / 07:03 and 19:03 winter time (UTC cron)
    - cron: "3 6,18 * * *"
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: read
  actions: write # for the keepalive step

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Find "add me" messages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py subscribers

      # uses GH_PAT, a fine-grained token with only "Secrets: Read and write" on this repo.
      - name: Save receiver list
        if: hashFiles('chat_ids.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set TELEGRAM_CHAT_ID --repo "${{ github.repository }}" < chat_ids.txt

       # GitHub pauses scheduled workflows in repos after 60 days without commits/activity
       # Re-enabling via API keeps it running without needing commits
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow_file/enable" || true
