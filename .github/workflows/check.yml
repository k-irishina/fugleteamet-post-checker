name: Check Fugleteamet posts

on:
  schedule:
    # Every 20 min, offset to avoid busiest times.
    # Cron is UTC: 06-19 UTC covers 08-21 Oslo in both summer (UTC+2) and winter (UTC+1);
    # the time check below skips the extra hour that falls outside 08-21 Oslo time.
    - cron: "7,27,47 6-19 * * *"
  workflow_dispatch: # "Run workflow" button for testing

permissions:
  contents: read
  actions: write # for the keepalive step

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Time check
        id: time
        run: |
          hour=$(TZ=Europe/Oslo date +%-H)
          if [ "${{ github.event_name }}" = schedule ] && { [ "$hour" -lt 8 ] || [ "$hour" -ge 21 ]; }; then
            echo "Night time in Oslo ($hour:xx), skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.time.outputs.skip != 'true'

      # seen.json lives in the Actions cache
      # Each run saves a new entry, restore-keys picks the newest one
      - name: Restore seen birds
        if: steps.time.outputs.skip != 'true'
        uses: actions/cache/restore@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check for new bird posts
        if: steps.time.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: seen.json
        run: python3 bot.py once

      - name: Save seen birds
        if: always() && steps.time.outputs.skip != 'true' && hashFiles('seen.json') != ''
        uses: actions/cache/save@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}

      # GitHub pauses scheduled workflows in repos after 60 days without commits/activity
      # Re-enabling via API keeps it running without needing commits
      - name: Keepalive
        if: steps.time.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow_file/enable" || true
