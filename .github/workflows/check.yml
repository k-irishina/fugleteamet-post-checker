name: Check Fugleteamet posts

on:
  schedule:
    # Twice a day, at 7 past in attempt to avoid busiest times
    - cron: "7 9,16 * * *"
  workflow_dispatch: # "Run workflow" button for testing

permissions:
  contents: read
  actions: write # for the keepalive step

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # seen.json lives in the Actions cache
      # Each run saves a new entry, restore-keys picks the newest one
      - name: Restore seen birds
        uses: actions/cache/restore@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check for new bird posts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py once

      - name: Save seen birds
        if: always() && hashFiles('seen.json') != ''
        uses: actions/cache/save@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}

      # GitHub pauses scheduled workflows in repos after 60 days without commits/activity
      # Re-enabling via API keeps it running without needing commits
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow_file/enable" || true
